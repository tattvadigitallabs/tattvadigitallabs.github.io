<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="256" height="256">
  <!-- Tattva Finance Calculator: the essence (gem) inside a two-part breakdown ring.
       Family with Tattva Image Compressor: same teal field and mint gem, a different "container" per app. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb3a6"/><stop offset=".55" stop-color="#0f6e6a"/><stop offset="1" stop-color="#083f3c"/>
    </linearGradient>
    <radialGradient id="shine" cx=".3" cy=".22" r=".75">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".22"/><stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9fbf4"/><stop offset="1" stop-color="#7fe8db"/>
    </linearGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect width="108" height="108" fill="url(#shine)"/>
  <g transform="translate(54 54) scale(.88) translate(-54 -54)">
    <!-- breakdown ring: principal (white) + interest/returns (mint) -->
    <g fill="none" stroke-width="7" stroke-linecap="round">
      <path d="M64.74 31.98A24.5 24.5 0 1 1 30.45 60.75" stroke="#ffffff"/>
      <path d="M30.45 47.25A24.5 24.5 0 0 1 51.44 29.63" stroke="#7fe8db"/>
    </g>
    <!-- the essence: what the number really means -->
    <g transform="rotate(45 54 54)"><rect x="44.25" y="44.25" width="19.5" height="19.5" rx="3.9" fill="url(#core)"/><path d="M48.15 44.25h11.7a3.9 3.9 0 0 1 3.9 3.9v11.7Z" fill="#ffffff" fill-opacity=".55"/></g>
  </g>
</svg>
